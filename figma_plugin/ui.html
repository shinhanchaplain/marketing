<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f8fafc;
      color: #0f172a;
      font-size: 13px;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 8px;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      color: #64748b;
      margin-top: 0;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    textarea {
      width: 100%;
      height: 180px;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: monospace;
      font-size: 11px;
      background: #ffffff;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }
    .options {
      margin: 12px 0;
      display: flex;
      gap: 12px;
    }
    label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    button {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #334155;
    }
    .btn-secondary:hover {
      background: #cbd5e1;
    }
    .badge {
      display: inline-block;
      background: #dbeafe;
      color: #1e40af;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h2>🚀 마케팅 10섹션 피그마 자동 빌더 <span class="badge">FREE</span></h2>
  <p>안티그래비티 마케팅 툴에서 생성된 JSON 데이터를 붙여넣고 버튼을 누르면 1초 만에 캔버스에 프레임이 생성됩니다.</p>
  
  <textarea id="jsonInput" placeholder="마케팅 툴에서 복사한 JSON 데이터를 여기에 붙여넣으세요..."></textarea>
  
  <div class="options">
    <label><input type="radio" name="mode" value="both" checked> 둘 다 생성 (PC + 모바일)</label>
    <label><input type="radio" name="mode" value="desktop"> 데스크톱만 (1440px)</label>
    <label><input type="radio" name="mode" value="mobile"> 모바일만 (390px)</label>
  </div>

  <div class="btn-group">
    <button class="btn-secondary" id="btnSample">샘플 데이터 불러오기</button>
    <button class="btn-primary" id="btnGenerate">🎨 캔버스에 1초 자동 생성</button>
  </div>

  <script>
    const sampleData = {
      "project_name": "NOVA DESK FOLD ONE 캠페인",
      "desktop": {
        "width": 1440,
        "sections": [
          {"type": "HERO", "title": "어디서 일하든, 내 작업을 10초 만에.", "desc": "6단계 각도 조절 · 620g 휴대용 스탠드", "cta": "FOLD ONE 자세히 보기", "price": "39,000원"},
          {"type": "PROBLEM", "title": "책상은 바뀌는데, 화면 각도는 그대로인가요?", "desc": "장소가 바뀔 때마다 겪는 시선 높이와 작업 리듬의 불편을 해결하세요."},
          {"type": "BENEFIT", "title": "620g과 전용 파우치 한 묶음", "desc": "가방에 쏙 들어가는 간결한 부피로 어디든 함께 이동합니다."},
          {"type": "PROOF", "title": "확인된 숫자로 선택하세요", "desc": "6단계 조절 · 620g · 39,000원"},
          {"type": "OFFER", "title": "지금 시작하는 패키지: FOLD ONE", "desc": "본품 + 전용 파우치 포함 구성", "cta": "바로 신청하기"}
        ]
      },
      "mobile": {
        "width": 390,
        "sections": [
          {"type": "HERO_MOBILE", "title": "내 작업을 10초 만에.", "desc": "6단계 각도 조절 · 620g", "cta": "자세히 보기", "price": "39,000원"},
          {"type": "PROBLEM_MOBILE", "title": "장소마다 달라지는 각도", "desc": "매번 흐트러지는 작업 환경"},
          {"type": "BENEFIT_MOBILE", "title": "한 묶음으로 가볍게", "desc": "전용 파우치 포함"},
          {"type": "PROOF_MOBILE", "title": "숫자로 보는 팩트", "desc": "6단계 / 620g / 39,000원"},
          {"type": "OFFER_MOBILE", "title": "패키지 39,000원", "cta": "바로 신청하기"}
        ]
      }
    };

    document.getElementById('btnSample').onclick = () => {
      document.getElementById('jsonInput').value = JSON.stringify(sampleData, null, 2);
    };

    document.getElementById('btnGenerate').onclick = () => {
      const text = document.getElementById('jsonInput').value.trim();
      let data = sampleData;
      if (text) {
        try {
          data = JSON.parse(text);
        } catch (e) {
          alert('JSON 형식 오류: 형식을 확인해주세요!');
          return;
        }
      }
      const mode = document.querySelector('input[name="mode"]:checked').value;
      parent.postMessage({ pluginMessage: { type: 'BUILD_PAGES', data: data, mode: mode } }, '*');
    };
  </script>
</body>
</html>
